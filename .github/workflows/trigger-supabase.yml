name: Trigger Supabase Edge Functions

on:
  schedule:
    - cron: '0 */3 * * *'  # Every 3 hours (UTC)
  workflow_dispatch:       # Allows manual trigger from GitHub UI

jobs:
  call-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 20    # Optional: job will be killed if it runs longer than 20 minutes
    steps:
      - name: Call Supabase Edge Function news_fetch
        run: |
        curl -L -X POST 'https://systmzaxlbymwcsrserr.supabase.co/functions/v1/news_fetch' \
  -H 'Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}' \
  -H 'Content-Type: application/json' \
  --data '{"name":"Functions"}'

 