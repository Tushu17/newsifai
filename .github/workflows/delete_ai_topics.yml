name: Trigger delete_ai_topics

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

jobs:
  call-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Call delete_ai_topics Function
        run: |
          curl -L -X POST 'https://systmzaxlbymwcsrserr.supabase.co/functions/v1/delete_ai_topics' \
          -H 'Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}' \
          -H 'Content-Type: application/json' \
          --data '{"name":"Functions"}'
