name: Trigger Ai_raw_news_update

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  call-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Call Ai_raw_news_update Function
        run: |
          curl -L -X POST 'https://systmzaxlbymwcsrserr.supabase.co/functions/v1/Ai_raw_news_update' \
            -H 'Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}' \
            -H 'Content-Type: application/json' \
            --data '{"name":"Functions"}'
